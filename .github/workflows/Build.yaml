name: 🐍 VenomCore Kernel Builder (spinel)

# VenomCore kernel builder for Redmi Note 15 4G (spinel)
#
# Source:
#   mkvenompro/VenomCore_kernel_builder
#   branch: spinel-assembled
#
# Target:
#   Redmi Note 15 4G (spinel)
#   Android 15 / HyperOS 2
#   Linux 5.10
#
# Root options:
#   KernelSU-Next
#   SukiSU-Ultra
#
# Optional:
#   SUSFS
#
# Output:
#   Raw kernel Image
#   AnyKernel3 flashable ZIP
#
# Maintainer:
#   MkVenomPro

on:
  workflow_dispatch:
    inputs:

      source_branch:
        description: "Branch in this repository containing the assembled kernel tree"
        required: true
        default: "spinel-assembled"

      ksu_variant:
        description: "Root solution"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra

      susfs_enabled:
        description: "Enable SUSFS"
        required: true
        default: true
        type: boolean

      kernel_name:
        description: "Kernel build name"
        required: true
        default: "VenomCore"


env:
  KERNEL_DIR: kernel_workspace
  ARCH: arm64


jobs:

  build:

    name: Build VenomCore

    runs-on: ubuntu-latest

    timeout-minutes: 180


    steps:

      # ============================================================
      # MAXIMIZE BUILD SPACE
      # ============================================================

      - name: Maximize build space

        uses: easimon/maximize-build-space@master

        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            binutils-aarch64-linux-gnu \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pahole \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python3-pip \
            device-tree-compiler \
            libc6-dev-i386


      # ============================================================
      # VERIFY TOOLCHAIN DEPENDENCIES
      # ============================================================

      - name: Verify host tools

        run: |

          set -e

          echo "=========================================="
          echo " Host tool verification"
          echo "=========================================="

          echo
          echo "make:"
          make --version | head -n1

          echo
          echo "python:"
          python3 --version

          echo
          echo "git:"
          git --version

          echo
          echo "bc:"
          bc --version | head -n1

          echo
          echo "dtc:"
          dtc --version

          echo
          echo "AArch64 binutils:"
          which aarch64-linux-gnu-ld
          which aarch64-linux-gnu-as
          which aarch64-linux-gnu-objcopy
          which aarch64-linux-gnu-strip

          echo
          aarch64-linux-gnu-ld --version | head -n1


      # ============================================================
      # CLONE ASSEMBLED KERNEL TREE
      # ============================================================

      - name: Clone assembled tree

        run: |

          set -e

          echo "=========================================="
          echo " Cloning VenomCore assembled kernel tree"
          echo "=========================================="

          git clone \
            --depth=1 \
            -b "${{ inputs.source_branch }}" \
            "https://github.com/${{ github.repository }}.git" \
            "$KERNEL_DIR"

          echo
          echo "--- repository root ---"

          ls -lah "$KERNEL_DIR"

          echo
          echo "--- assembly marker ---"

          if [ ! -f "$KERNEL_DIR/VENOMCORE_ASSEMBLY.md" ]; then

            echo "::error::VENOMCORE_ASSEMBLY.md not found."

            echo
            echo "This branch does not appear to be an assembled VenomCore tree."

            exit 1

          fi

          echo "VENOMCORE_ASSEMBLY.md found."

          echo
          echo "--- Makefile ---"

          if [ ! -f "$KERNEL_DIR/Makefile" ]; then

            echo "::error::Kernel Makefile not found."

            exit 1

          fi

          echo "Kernel Makefile found."

          echo
          echo "--- ARM64 config directory ---"

          if [ ! -d "$KERNEL_DIR/arch/arm64/configs" ]; then

            echo "::error::arch/arm64/configs does not exist."

            exit 1

          fi

          ls -lah "$KERNEL_DIR/arch/arm64/configs"

          echo
          echo "--- kernel version ---"

          make -C "$KERNEL_DIR" kernelversion


      # ============================================================
      # SHOW TREE INFORMATION
      # ============================================================

      - name: Inspect assembled tree

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          echo "=========================================="
          echo " VenomCore assembled tree inspection"
          echo "=========================================="

          echo
          echo "--- Git commit ---"

          git log -1 --oneline

          echo
          echo "--- Kernel version ---"

          make kernelversion

          echo
          echo "--- ARM64 configs ---"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "--- MTK directories ---"

          if [ -d drivers/misc/mediatek ]; then
            echo "drivers/misc/mediatek: FOUND"
          else
            echo "drivers/misc/mediatek: NOT FOUND"
          fi

          if [ -d vendor/mtk_modules_raw ]; then
            echo "vendor/mtk_modules_raw: FOUND"
            find vendor/mtk_modules_raw \
              -maxdepth 2 \
              -type d \
              | head -n50
          else
            echo "vendor/mtk_modules_raw: NOT FOUND"
          fi


      # ============================================================
      # LOCATE DEFCONFIG
      # ============================================================

      - name: Locate defconfig

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          CONFIG_DIR="arch/${ARCH}/configs"

          echo "=========================================="
          echo " Locating kernel defconfig"
          echo "=========================================="

          echo
          echo "--- Available configs ---"

          ls -lah "$CONFIG_DIR"

          echo

          # --------------------------------------------------------
          # First priority:
          # Spinel-specific config
          # --------------------------------------------------------

          FOUND=$(find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            -iname "*spinel*defconfig*" \
            -print \
            | head -n1)

          if [ -n "$FOUND" ]; then

            DEFCONFIG_NAME=$(basename "$FOUND")

            echo "Spinel-specific defconfig found:"
            echo "$DEFCONFIG_NAME"

            echo "DEFCONFIG=$DEFCONFIG_NAME" >> "$GITHUB_ENV"

            exit 0

          fi


          # --------------------------------------------------------
          # Second priority:
          # Existing generic ARM64 defconfig
          # --------------------------------------------------------

          if [ -f "$CONFIG_DIR/defconfig" ]; then

            echo "::notice::No Spinel-specific defconfig found."
            echo "::notice::Using arch/arm64/configs/defconfig"

            echo "DEFCONFIG=defconfig" >> "$GITHUB_ENV"

            exit 0

          fi


          # --------------------------------------------------------
          # Third priority:
          # GKI defconfig
          # --------------------------------------------------------

          if [ -f "$CONFIG_DIR/gki_defconfig" ]; then

            echo "::notice::Using arch/arm64/configs/gki_defconfig"

            echo "DEFCONFIG=gki_defconfig" >> "$GITHUB_ENV"

            exit 0

          fi


          echo "::error::No usable defconfig found."

          exit 1


      # ============================================================
      # SETUP ANDROID CLANG
      # ============================================================

      - name: Set up Android Clang

        run: |

          set -e

          echo "=========================================="
          echo " Setting up Android Clang"
          echo "=========================================="

          rm -rf clang

          git clone \
            --depth=1 \
            -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          echo
          echo "--- Searching for clang ---"

          CLANG_BIN_DIR=$(find clang \
            -type f \
            -name clang \
            -printf '%h\n' \
            | head -n1)

          if [ -z "$CLANG_BIN_DIR" ]; then

            echo "::error::Android Clang executable not found."

            find clang \
              -maxdepth 4 \
              -type f \
              -name clang \
              -print

            exit 1

          fi

          echo "Clang bin directory:"
          echo "$CLANG_BIN_DIR"

          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"

          echo
          echo "--- LLVM tools ---"

          if [ -x "$CLANG_BIN_DIR/clang" ]; then
            echo "clang: FOUND"
          else
            echo "::error::clang executable missing"
            exit 1
          fi

          if [ -x "$CLANG_BIN_DIR/clang++" ]; then
            echo "clang++: FOUND"
          fi

          if [ -x "$CLANG_BIN_DIR/ld.lld" ]; then
            echo "ld.lld: FOUND"
          else
            echo "::warning::ld.lld not found in clang directory"
          fi

          if [ -x "$CLANG_BIN_DIR/llvm-ar" ]; then
            echo "llvm-ar: FOUND"
          fi

          if [ -x "$CLANG_BIN_DIR/llvm-nm" ]; then
            echo "llvm-nm: FOUND"
          fi

          if [ -x "$CLANG_BIN_DIR/llvm-objcopy" ]; then
            echo "llvm-objcopy: FOUND"
          fi


      # ============================================================
      # VERIFY CLANG
      # ============================================================

      - name: Verify Clang

        run: |

          set -e

          echo "=========================================="
          echo " Clang verification"
          echo "=========================================="

          which clang

          echo
          clang --version

          echo
          echo "clang++:"
          which clang++ || true

          echo
          echo "ld.lld:"
          which ld.lld || true

          echo
          echo "llvm-ar:"
          which llvm-ar || true

          echo
          echo "llvm-nm:"
          which llvm-nm || true

          echo
          echo "llvm-objcopy:"
          which llvm-objcopy || true


      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Set up KernelSU-Next

        if: ${{ inputs.ksu_variant == 'KernelSU-Next' }}

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          echo "=========================================="
          echo " Setting up KernelSU-Next"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          echo
          echo "--- KernelSU-Next status ---"

          if [ ! -d KernelSU-Next ]; then

            echo "::error::KernelSU-Next directory was not created."

            exit 1

          fi

          echo "KernelSU-Next directory:"
          ls -lah KernelSU-Next

          echo
          echo "--- KernelSU-Next commit ---"

          git -C KernelSU-Next log -1 --oneline

          KSU_GIT_VERSION=$(git -C KernelSU-Next rev-list --count HEAD)

          echo "KSU_GIT_VERSION=$KSU_GIT_VERSION" >> "$GITHUB_ENV"


      # ============================================================
      # SUKISU-ULTRA
      # ============================================================

      - name: Set up SukiSU-Ultra

        if: ${{ inputs.ksu_variant == 'SukiSU-Ultra' }}

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          echo "=========================================="
          echo " Setting up SukiSU-Ultra"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main

          echo
          echo "--- SukiSU-Ultra status ---"

          if [ ! -d KernelSU-Next ] && [ ! -d KernelSU ]; then

            echo "::error::SukiSU setup did not create a KernelSU source directory."

            exit 1

          fi

          echo "SukiSU setup completed."


      # ============================================================
      # SUSFS
      # ============================================================

      - name: Apply SUSFS

        if: ${{ inputs.susfs_enabled }}

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          echo "=========================================="
          echo " SUSFS"
          echo " Android 12 / Linux 5.10"
          echo "=========================================="

          rm -rf susfs4ksu

          echo
          echo "Cloning SUSFS branch:"
          echo "gki-android12-5.10"

          git clone \
            --depth=1 \
            -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          echo
          echo "--- SUSFS commit ---"

          git -C susfs4ksu log -1 --oneline

          echo
          echo "--- SUSFS tree ---"

          find susfs4ksu/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort


          # --------------------------------------------------------
          # Copy SUSFS filesystem changes
          # --------------------------------------------------------

          echo
          echo "--- Copying SUSFS fs files ---"

          if [ -d susfs4ksu/kernel_patches/fs ]; then

            cp -a \
              susfs4ksu/kernel_patches/fs/. \
              fs/

          else

            echo "::error::SUSFS fs directory missing."

            exit 1

          fi


          # --------------------------------------------------------
          # Copy SUSFS Linux headers
          # --------------------------------------------------------

          echo
          echo "--- Copying SUSFS headers ---"

          if [ -d susfs4ksu/kernel_patches/include/linux ]; then

            cp -a \
              susfs4ksu/kernel_patches/include/linux/. \
              include/linux/

          else

            echo "::error::SUSFS include/linux directory missing."

            exit 1

          fi


          # --------------------------------------------------------
          # Kernel patch
          # --------------------------------------------------------

          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch"

          echo
          echo "--- Checking kernel patch ---"

          if [ ! -f "$SUSFS_KERNEL_PATCH" ]; then

            echo "::error::SUSFS 5.10 kernel patch not found."

            echo
            echo "Expected:"
            echo "$SUSFS_KERNEL_PATCH"

            echo
            echo "Available patches:"

            find susfs4ksu/kernel_patches \
              -maxdepth 1 \
              -type f \
              -name "*.patch" \
              -printf '%f\n' \
              | sort

            exit 1

          fi

          echo "Patch found:"
          echo "$SUSFS_KERNEL_PATCH"


          # --------------------------------------------------------
          # Apply kernel SUSFS patch
          # --------------------------------------------------------

          echo
          echo "--- Applying SUSFS kernel patch ---"

          patch \
            --batch \
            --forward \
            -p1 \
            < "$SUSFS_KERNEL_PATCH"


          # --------------------------------------------------------
          # KernelSU integration
          # --------------------------------------------------------

          echo
          echo "--- Locating KernelSU integration ---"

          if [ -d KernelSU-Next ]; then

            SUSFS_KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

            if [ ! -f "$SUSFS_KSU_PATCH" ]; then

              echo "::error::SUSFS KernelSU integration patch not found."

              echo "$SUSFS_KSU_PATCH"

              exit 1

            fi

            cp \
              "$SUSFS_KSU_PATCH" \
              KernelSU-Next/

            echo
            echo "--- Applying SUSFS KernelSU patch ---"

            (
              cd KernelSU-Next

              patch \
                --batch \
                --forward \
                -p1 \
                < 10_enable_susfs_for_ksu.patch
            )

          elif [ -d KernelSU ]; then

            SUSFS_KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

            if [ ! -f "$SUSFS_KSU_PATCH" ]; then

              echo "::error::SUSFS KernelSU integration patch not found."

              exit 1

            fi

            cp \
              "$SUSFS_KSU_PATCH" \
              KernelSU/

            (
              cd KernelSU

              patch \
                --batch \
                --forward \
                -p1 \
                < 10_enable_susfs_for_ksu.patch
            )

          else

            echo "::error::Could not find KernelSU source directory."

            exit 1

          fi


          echo
          echo "=========================================="
          echo " SUSFS applied successfully"
          echo "=========================================="


      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================

      - name: Apply VenomCore configuration

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          CFG="arch/${ARCH}/configs/${DEFCONFIG}"

          if [ ! -f "$CFG" ]; then

            echo "::error::Defconfig not found:"
            echo "$CFG"

            exit 1

          fi

          echo "=========================================="
          echo " VenomCore kernel configuration"
          echo "=========================================="

          echo
          echo "Using:"
          echo "$CFG"

          # --------------------------------------------------------
          # Remove old duplicate entries first
          # --------------------------------------------------------

          sed -i \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KSU_SUSFS=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_PATH=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_MOUNT=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_KSTAT=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_SU=/d' \
            -e '/^CONFIG_KSU_SUSFS_TRY_UMOUNT=/d' \
            -e '/^CONFIG_KSU_SUSFS_SPOOF_UNAME=/d' \
            -e '/^CONFIG_KSU_SUSFS_OPEN_REDIRECT=/d' \
            -e '/^CONFIG_LOCALVERSION=/d' \
            "$CFG"


          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          echo "CONFIG_KSU=y" >> "$CFG"


          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------

          if [ "${{ inputs.susfs_enabled }}" = "true" ]; then

            echo "CONFIG_KSU_SUSFS=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CFG"

          else

            echo "CONFIG_KSU_SUSFS=n" >> "$CFG"

          fi


          # --------------------------------------------------------
          # Kernel local version
          # --------------------------------------------------------

          echo 'CONFIG_LOCALVERSION="-${{ inputs.kernel_name }}"' >> "$CFG"


          echo
          echo "--- Final requested config ---"

          tail -n30 "$CFG"


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -o pipefail

          echo "=========================================="
          echo " VenomCore Kernel Build"
          echo "=========================================="

          export ARCH=arm64

          # --------------------------------------------------------
          # We intentionally do NOT install gcc-aarch64-linux-gnu.
          #
          # Android kernel is built with Android Clang.
          # GNU AArch64 binutils are used through CROSS_COMPILE.
          # --------------------------------------------------------

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC=clang

          export HOSTCC=clang
          export HOSTCXX=clang++

          echo
          echo "ARCH          = ${ARCH}"
          echo "LLVM          = ${LLVM}"
          echo "LLVM_IAS      = ${LLVM_IAS}"
          echo "CROSS_COMPILE = ${CROSS_COMPILE}"
          echo "CLANG_TRIPLE  = ${CLANG_TRIPLE}"
          echo "CC            = ${CC}"
          echo "HOSTCC        = ${HOSTCC}"
          echo "DEFCONFIG     = ${DEFCONFIG}"

          echo
          echo "--- Compiler ---"

          which clang
          clang --version

          echo
          echo "--- Binutils ---"

          which aarch64-linux-gnu-ld
          which aarch64-linux-gnu-objcopy
          which aarch64-linux-gnu-strip

          # --------------------------------------------------------
          # Clean output directory
          # --------------------------------------------------------

          rm -rf out

          mkdir -p out


          # ========================================================
          # DEFCONFIG
          # ========================================================

          echo
          echo "=========================================="
          echo " Generating kernel configuration"
          echo "=========================================="

          make \
            ARCH="${ARCH}" \
            O=out \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            HOSTCXX="${HOSTCXX}" \
            "${DEFCONFIG}"


          if [ ! -f out/.config ]; then

            echo "::error::out/.config was not generated."

            exit 1

          fi


          # ========================================================
          # CHECK IMPORTANT CONFIGS
          # ========================================================

          echo
          echo "=========================================="
          echo " Checking generated configuration"
          echo "=========================================="

          echo
          echo "KernelSU:"
          grep -E '^CONFIG_KSU=' out/.config || true

          echo
          echo "SUSFS:"
          grep -E '^CONFIG_KSU_SUSFS' out/.config || true

          echo
          echo "Local version:"
          grep -E '^CONFIG_LOCALVERSION=' out/.config || true


          # ========================================================
          # BUILD
          # ========================================================

          echo
          echo "=========================================="
          echo " Starting kernel compilation"
          echo "=========================================="

          make \
            ARCH="${ARCH}" \
            O=out \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            HOSTCXX="${HOSTCXX}" \
            -j"$(nproc --all)" \
            2>&1 | tee build.log


          # ========================================================
          # VERIFY OUTPUT
          # ========================================================

          echo
          echo "=========================================="
          echo " Checking kernel output"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then

            echo "FOUND: Image.gz-dtb"

          elif [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "FOUND: Image.gz"

          elif [ -f out/arch/arm64/boot/Image ]; then

            echo "FOUND: Image"

          else

            echo "::error::No kernel Image was produced."

            echo
            echo "--- boot directory ---"

            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -printf '%p\n' \
              | sort

            exit 1

          fi


      # ============================================================
      # PACKAGE RAW IMAGE
      # ============================================================

      - name: Package raw kernel image

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -e

          mkdir -p ../VenomCore-out

          echo "=========================================="
          echo " Packaging kernel image"
          echo "=========================================="

          IMG=""

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then

            IMG="out/arch/arm64/boot/Image.gz-dtb"

          elif [ -f out/arch/arm64/boot/Image.gz ]; then

            IMG="out/arch/arm64/boot/Image.gz"

          elif [ -f out/arch/arm64/boot/Image ]; then

            IMG="out/arch/arm64/boot/Image"

          fi


          if [ -z "$IMG" ]; then

            echo "::error::Kernel image not found."

            exit 1

          fi


          echo "Selected image:"
          echo "$IMG"

          cp \
            "$IMG" \
            ../VenomCore-out/Image


          echo
          echo "Raw image:"
          ls -lh ../VenomCore-out/Image


      # ============================================================
      # CLONE ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3

        run: |

          set -e

          echo "=========================================="
          echo " Preparing AnyKernel3"
          echo "=========================================="

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3


          # Remove git metadata

          rm -rf \
            AnyKernel3/.git


          # Remove default ramdisk / patch content

          rm -rf \
            AnyKernel3/ramdisk \
            AnyKernel3/patch


          # Remove original script and keycheck

          rm -f \
            AnyKernel3/tools/keycheck \
            AnyKernel3/anykernel.sh


          # Copy kernel

          cp \
            VenomCore-out/Image \
            AnyKernel3/Image


          echo
          echo "--- AnyKernel3 contents ---"

          ls -lah AnyKernel3


      # ============================================================
      # WRITE ANYKERNEL SCRIPT
      # ============================================================

      - name: Write VenomCore AnyKernel script

        run: |

          set -e

          cat > AnyKernel3/anykernel.sh << 'EOF'

          ### AnyKernel3 Ramdisk Mod Script
          ## VenomCore Kernel
          ## MkVenomPro
          ##
          ## Device: Redmi Note 15 4G
          ## Codename: spinel
          ## Android: 15
          ## HyperOS: 2
          ## Kernel: 5.10

          ### AnyKernel setup

          properties() { '

          kernel.string=VenomCore Kernel by MkVenomPro | spinel

          do.devicecheck=1

          do.modules=0

          do.systemless=1

          do.cleanup=1

          do.cleanuponabort=0

