name: 🐍 VenomCore Kernel Builder (spinel)

# Builds from the ASSEMBLED tree (produced by the "VenomCore Tree Assembler"
# workflow) instead of raw MiCode sources. Run the assembler first at least once.
# Maintainer: MkVenomPro

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch in THIS repo holding the assembled tree"
        required: true
        default: "spinel-assembled"

      ksu_variant:
        description: "Root solution"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra

      susfs_enabled:
        description: "Enable SUSFS"
        required: true
        default: true
        type: boolean

      kernel_name:
        description: "Kernel build name (shown in kernel version string)"
        required: true
        default: "VenomCore"

env:
  KERNEL_DIR: kernel_workspace
  ARCH: arm64

jobs:
  build:
    name: Build ${{ inputs.kernel_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip \
            device-tree-compiler libc6-dev-i386

      - name: Clone assembled tree from ${{ inputs.source_branch }} (this repo)
        run: |
          set -e
          git clone --depth=1 -b "${{ inputs.source_branch }}" \
            "https://github.com/${{ github.repository }}.git" "$KERNEL_DIR"

          echo "--- assembled tree top-level ---"
          ls "$KERNEL_DIR"

          if [ ! -f "$KERNEL_DIR/VENOMCORE_ASSEMBLY.md" ]; then
            echo "::error::this doesn't look like an assembled tree (no VENOMCORE_ASSEMBLY.md) — run the assembler workflow first"
            exit 1
          fi

      - name: Locate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          CONFIG_DIR="arch/${ARCH}/configs"

          echo "=========================================="
          echo " Locating Spinel defconfig"
          echo "=========================================="
          echo

          # First try to find a Spinel-specific defconfig.
          FOUND=$(find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            -iname "*spinel*defconfig*" \
            -print \
            | head -n1)

          if [ -n "$FOUND" ]; then
            DEFCONFIG_NAME=$(basename "$FOUND")

            echo "Found Spinel-specific defconfig:"
            echo "$DEFCONFIG_NAME"

            echo "DEFCONFIG=$DEFCONFIG_NAME" >> "$GITHUB_ENV"
            exit 0
          fi

          # The assembled Spinel tree currently contains:
          #
          #   arch/arm64/configs/defconfig
          #
          # so don't fail just because the filename doesn't contain
          # "spinel".
          if [ -f "$CONFIG_DIR/defconfig" ]; then
            echo "::warning::no defconfig matching *spinel* found."
            echo "::notice::using existing defconfig: defconfig"

            echo "DEFCONFIG=defconfig" >> "$GITHUB_ENV"
            exit 0
          fi

          # Fallback to generic GKI configuration if available.
          if [ -f "$CONFIG_DIR/gki_defconfig" ]; then
            echo "::warning::no Spinel-specific defconfig or generic defconfig found."
            echo "::notice::using gki_defconfig"

            echo "DEFCONFIG=gki_defconfig" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::no usable defconfig found under $CONFIG_DIR"

          echo "--- available configs ---"
          ls "$CONFIG_DIR" || true

          exit 1

      - name: Set up Clang toolchain
        run: |
          set -e
          mkdir -p clang
          git clone --depth=1 -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

          CLANG_BIN_DIR=$(find clang -maxdepth 2 -type d -name 'bin' | head -n1)

          echo "$CLANG_BIN_DIR" >> $GITHUB_PATH
          echo "Clang resolved at: $CLANG_BIN_DIR"

      - name: Verify clang is on PATH
        run: |
          set -e
          which clang || (echo "::error::clang not found on PATH after toolchain step" && exit 1)
          clang --version

      - name: Set up KernelSU-Next
        if: ${{ inputs.ksu_variant == 'KernelSU-Next' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          echo "KSU_GIT_VERSION=$(cd KernelSU-Next && git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Set up SukiSU-Ultra
        if: ${{ inputs.ksu_variant == 'SukiSU-Ultra' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main

      - name: Apply SUSFS patches
        if: ${{ inputs.susfs_enabled }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git clone \
            --depth=1 \
            -b kernel-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cp susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

          patch -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch \
            || echo "::warning::susfs kernel patch had rejects — layout may differ from stock GKI tree, resolve manually before shipping"

          if [ -d KernelSU-Next ]; then
            cp \
              susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
              KernelSU-Next/ \
              2>/dev/null || true

            (
              cd KernelSU-Next
              patch -p1 < 10_enable_susfs_for_ksu.patch
            ) || echo "::warning::susfs KSU patch had rejects — resolve manually before shipping"
          fi

      - name: Apply defconfig flags
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          CFG="arch/${ARCH}/configs/${DEFCONFIG}"

          if [ ! -f "$CFG" ]; then
            echo "::error::defconfig not found at $CFG"
            exit 1
          fi

          echo "CONFIG_KSU=y" >> "$CFG"
          echo "CONFIG_KSU_SUSFS=${{ inputs.susfs_enabled && 'y' || 'n' }}" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CFG"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CFG"
          echo "CONFIG_LOCALVERSION=\"-${{ inputs.kernel_name }}\"" >> "$CFG"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          export ARCH=${ARCH}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          make O=out "${DEFCONFIG}"

          make O=out \
            -j"$(nproc --all)" \
            2>&1 | tee build.log

      - name: Package boot image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          mkdir -p ../VenomCore-out

          IMG=$(find out \
            -name "Image.gz-dtb" \
            -o -name "Image.gz" \
            -o -name "Image" \
            | head -n1)

          if [ -z "$IMG" ]; then
            echo "::error::no kernel Image produced — check build.log"
            exit 1
          fi

          echo "Kernel image found:"
          echo "$IMG"

          cp "$IMG" ../VenomCore-out/Image

      - name: Clone AnyKernel3 template
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf \
            AnyKernel3/.git \
            AnyKernel3/ramdisk \
            AnyKernel3/patch

          rm -f \
            AnyKernel3/tools/keycheck \
            AnyKernel3/anykernel.sh

          cp \
            VenomCore-out/Image \
            AnyKernel3/Image

      - name: Write anykernel.sh (VenomCore branded)
        run: |
          cat > AnyKernel3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=VenomCore Kernel by MkVenomPro | spinel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=spinel
          supported.versions=15
          supported.patchlevels=
          '; }

          ### AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh

          ### AnyKernel install
          ui_print " "
          ui_print " "
          ui_print "░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░"
          ui_print " "
          ui_print "   ██╗   ██╗███████╗███╗   ██╗ ██████╗ ███╗   ███╗"
          ui_print "   ██║   ██║██╔════╝████╗  ██║██╔═══██╗████╗ ████║"
          ui_print "   ██║   ██║█████╗  ██╔██╗ ██║██║   ██║██╔████╔██║"
          ui_print "   ╚██╗ ██╔╝██╔══╝  ██║╚██╗██║██║   ██║██║╚██╔╝██║"
          ui_print "    ╚████╔╝ ███████╗██║ ╚████║╚██████╔╝██║ ╚═╝ ██║"
          ui_print "     ╚═══╝  ╚══════╝╚═╝  ╚═══╝ ╚═════╝ ╚═╝     ╚═╝"
          ui_print " "
          ui_print "            C  O  R  E   K  E  R  N  E  L"
          ui_print " "
          ui_print "░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░"
          ui_print " "
          ui_print "        🐍  crafted by @MkVenomPro  🐍"
          ui_print " "
          ui_print "───────────────────────────────────────"
          ui_print "  Device .... Redmi Note 15 4G (spinel)"
          ui_print "  Root ...... ${{ inputs.ksu_variant }}"
          ui_print "  SUSFS ..... ${{ inputs.susfs_enabled }}"
          ui_print "  Build ..... #${{ github.run_number }}"
          ui_print "───────────────────────────────────────"
          ui_print " "
          ui_print "  >> Injecting VenomCore into boot..."
          ui_print " "

          dump_boot

          # kernel Image is already staged as ./Image by the workflow
          write_boot

          ui_print " "
          ui_print "───────────────────────────────────────"
          ui_print "   ✔  VENOMCORE INSTALLED SUCCESSFULLY"
          ui_print "───────────────────────────────────────"
          ui_print " "
          ui_print "   Reboot the device and enjoy the bite."
          ui_print " "
          ui_print "        🐍  @MkVenomPro  🐍"
          ui_print " "
          EOF

      - name: Package VenomCore AnyKernel3 zip
        run: |
          set -e

          ZIP_NAME="VenomCore-spinel-${{ inputs.ksu_variant }}-build${{ github.run_number }}.zip"

          cd AnyKernel3

          zip \
            -r9 \
            "../$ZIP_NAME" \
            . \
            -x ".git*"

          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VenomCore-build-log
          path: ${{ env.KERNEL_DIR }}/build.log
          if-no-files-found: ignore

      - name: Upload VenomCore raw kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}-spinel-raw-${{ github.run_number }}
          path: VenomCore-out/Image
          retention-days: 14

      - name: Upload VenomCore flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### 🐍 ${{ inputs.kernel_name }} build finished" >> $GITHUB_STEP_SUMMARY
          echo "- Source branch: ${{ inputs.source_branch }} (assembled tree, this repo)" >> $GITHUB_STEP_SUMMARY
          echo "- Root: ${{ inputs.ksu_variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- SUSFS: ${{ inputs.susfs_enabled }}" >> $GITHUB_STEP_SUMMARY
          echo "- Defconfig used: ${DEFCONFIG:-not resolved}" >> $GITHUB_STEP_SUMMARY
