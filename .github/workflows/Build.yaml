name: 🐍 Build VenomCore

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "defconfig"
        type: string

      clean:
        description: "Clean output directory before build"
        required: true
        default: true
        type: boolean

      build_modules:
        description: "Build kernel modules"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build VenomCore
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: ${{ inputs.defconfig }}
      OUT_DIR: ${{ github.workspace }}/out

      # LLVM/Clang
      LLVM: 1
      LLVM_IAS: 1

      # Kernel source is the repository root
      KERNEL_DIR: ${{ github.workspace }}

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: spinel-assembled
          fetch-depth: 1
          submodules: false

      # ============================================================
      # System information
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " VenomCore Kernel Builder"
          echo "=========================================="
          echo
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Kernel dir : $KERNEL_DIR"
          echo "Output dir : $OUT_DIR"
          echo "Defconfig  : $DEFCONFIG"
          echo
          echo "CPU:"
          nproc
          echo
          echo "Clang:"
          clang --version || true
          echo
          echo "GCC:"
          gcc --version | head -n 1 || true
          echo
          echo "=========================================="

      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            clang \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      # ============================================================
      # Verify kernel source
      # ============================================================

      - name: Verify kernel source tree
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "Checking kernel source..."

          if [ ! -f Makefile ]; then
            echo "::error::Kernel Makefile not found."
            exit 1
          fi

          if [ ! -d arch/arm64 ]; then
            echo "::error::arch/arm64 directory not found."
            exit 1
          fi

          if [ ! -d arch/arm64/configs ]; then
            echo "::error::arch/arm64/configs directory not found."
            exit 1
          fi

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Available ARM64 configs:"
          find arch/arm64/configs -maxdepth 1 -type f \
            -printf '%f\n' | sort

          echo
          echo "Source tree looks valid."

      # ============================================================
      # Verify selected defconfig
      # ============================================================

      - name: Verify defconfig
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          CONFIG="arch/arm64/configs/${DEFCONFIG}"

          echo "Selected defconfig:"
          echo "$CONFIG"

          if [ ! -f "$CONFIG" ]; then
            echo
            echo "::error::Defconfig '$DEFCONFIG' does not exist."
            echo
            echo "Available configs:"
            find arch/arm64/configs -maxdepth 1 -type f \
              -printf '%f\n' | sort
            exit 1
          fi

          echo
          echo "Defconfig found successfully."

      # ============================================================
      # Prepare output directory
      # ============================================================

      - name: Prepare output directory
        shell: bash
        run: |
          set -e

          if [ "${{ inputs.clean }}" = "true" ]; then
            echo "Cleaning output directory..."
            rm -rf "$OUT_DIR"
          fi

          mkdir -p "$OUT_DIR"

          echo "Output directory:"
          echo "$OUT_DIR"

      # ============================================================
      # Configure kernel
      # ============================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo " Configuring kernel"
          echo "=========================================="
          echo
          echo "Defconfig: $DEFCONFIG"
          echo

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            "$DEFCONFIG"

          echo
          echo "Kernel configuration completed."

      # ============================================================
      # Show important configuration
      # ============================================================

      - name: Check kernel configuration
        shell: bash
        run: |
          set -e

          CONFIG="$OUT_DIR/.config"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::.config was not generated."
            exit 1
          fi

          echo "=========================================="
          echo " Important configuration"
          echo "=========================================="

          grep -E \
            '^(CONFIG_ARCH_MEDIATEK|CONFIG_MTK|CONFIG_MODULES|CONFIG_KPROBES|CONFIG_KALLSYMS|CONFIG_LTO_CLANG|CONFIG_CFI_CLANG)=' \
            "$CONFIG" || true

          echo
          echo "Config size:"
          wc -l "$CONFIG"

      # ============================================================
      # Build kernel
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo " Building VenomCore"
          echo "=========================================="
          echo
          echo "Architecture : $ARCH"
          echo "Defconfig    : $DEFCONFIG"
          echo "Output       : $OUT_DIR"
          echo "CPU cores    : $(nproc)"
          echo

          make \
            -C "$KERNEL_DIR" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            -j"$(nproc)"

      # ============================================================
      # Build modules
      # ============================================================

      - name: Build modules
        if: ${{ inputs.build_modules }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo " Building kernel modules"
          echo "=========================================="

          make \
            -C "$KERNEL_DIR" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            modules \
            -j"$(nproc)"

      # ============================================================
      # Collect build information
      # ============================================================

      - name: Collect build information
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUT_DIR/artifacts"

          echo "==========================================" \
            > "$OUT_DIR/artifacts/build-info.txt"

          echo " VenomCore Build Information" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "==========================================" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Repository: $GITHUB_REPOSITORY" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Branch: $GITHUB_REF_NAME" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Commit: $GITHUB_SHA" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Defconfig: $DEFCONFIG" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Kernel version:" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          make \
            -C "$KERNEL_DIR" \
            kernelversion \
            >> "$OUT_DIR/artifacts/build-info.txt" 2>&1

          echo \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Clang:" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          clang --version \
            >> "$OUT_DIR/artifacts/build-info.txt" 2>&1

          echo \
            >> "$OUT_DIR/artifacts/build-info.txt"

          echo "Build date:" \
            >> "$OUT_DIR/artifacts/build-info.txt"

          date -u \
            >> "$OUT_DIR/artifacts/build-info.txt"

      # ============================================================
      # Copy kernel image
      # ============================================================

      - name: Collect kernel image
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUT_DIR/artifacts"

          echo "Searching for kernel Image..."

          if [ -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            cp \
              "$OUT_DIR/arch/arm64/boot/Image" \
              "$OUT_DIR/artifacts/Image"

            echo "Image copied."
          else
            echo "::warning::Image not found."
          fi

          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
            cp \
              "$OUT_DIR/arch/arm64/boot/Image.gz" \
              "$OUT_DIR/artifacts/Image.gz"

            echo "Image.gz copied."
          fi

          if [ -f "$OUT_DIR/arch/arm64/boot/Image.lz4" ]; then
            cp \
              "$OUT_DIR/arch/arm64/boot/Image.lz4" \
              "$OUT_DIR/artifacts/Image.lz4"

            echo "Image.lz4 copied."
          fi

      # ============================================================
      # Collect DTBs / DTBOs
      # ============================================================

      - name: Collect DTB and DTBO files
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$OUT_DIR/artifacts/dtb"

          echo "Searching for DTB files..."

          find "$OUT_DIR/arch/arm64/boot" \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -exec cp --parents {} "$OUT_DIR/artifacts/dtb/" \; \
            2>/dev/null || true

          echo
          echo "Collected DT files:"
          find "$OUT_DIR/artifacts/dtb" \
            -type f \
            -print \
            2>/dev/null || true

      # ============================================================
      # Collect modules
      # ============================================================

      - name: Collect modules
        if: ${{ inputs.build_modules }}
        shell: bash
        run: |
          set +e

          mkdir -p "$OUT_DIR/artifacts/modules"

          echo "Searching for kernel modules..."

          find "$OUT_DIR" \
            -type f \
            -name "*.ko" \
            -exec cp --parents {} "$OUT_DIR/artifacts/modules/" \; \
            2>/dev/null || true

          echo
          echo "Module count:"
          find "$OUT_DIR/artifacts/modules" \
            -type f \
            -name "*.ko" \
            2>/dev/null | wc -l

      # ============================================================
      # Save .config
      # ============================================================

      - name: Collect .config
        if: always()
        shell: bash
        run: |
          set -e

          if [ -f "$OUT_DIR/.config" ]; then
            cp \
              "$OUT_DIR/.config" \
              "$OUT_DIR/artifacts/kernel.config"
          fi

      # ============================================================
      # Generate manifest
      # ============================================================

      - name: Generate artifact manifest
        if: always()
        shell: bash
        run: |
          set +e

          cd "$OUT_DIR/artifacts"

          echo "VenomCore artifact manifest" \
            > manifest.txt

          echo \
            >> manifest.txt

          find . \
            -type f \
            -printf '%p\n' \
            | sort \
            >> manifest.txt

          echo
          echo "=========================================="
          echo " Artifacts"
          echo "=========================================="

          find . \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload VenomCore artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VenomCore-spinel-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/out/artifacts/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
