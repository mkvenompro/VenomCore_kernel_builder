name: 🐍 VenomCore Kernel Builder (spinel)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch containing the assembled kernel tree"
        required: true
        default: "spinel-assembled-v2"

      ksu_variant:
        description: "Root solution (SukiSU-Ultra recommended with SUSFS)"
        required: true
        default: "SukiSU-Ultra"
        type: choice
        options:
          - SukiSU-Ultra
          - KernelSU-Next

      susfs_enabled:
        description: "Enable SUSFS"
        required: true
        default: true
        type: boolean

      kernel_name:
        description: "Kernel build name"
        required: true
        default: "VenomCore"

      kernelsu_ref:
        description: "KernelSU-Next ref (branch/tag). Floating 'next' breaks the SUSFS patch. Use a v1.x tag for SUSFS builds."
        required: true
        default: "v1.0.9"

      susfs_ref:
        description: "susfs4ksu ref (branch/tag/commit)"
        required: true
        default: "gki-android12-5.10"

env:
  KERNEL_DIR: kernel_workspace
  ARCH: arm64

jobs:
  build:
    name: Build VenomCore
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # MAXIMIZE BUILD SPACE
      # ============================================================

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            binutils-aarch64-linux-gnu \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pahole \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python3-pip \
            device-tree-compiler \
            libc6-dev-i386

      # ============================================================
      # CLANG COMPATIBILITY LIBRARIES
      # ============================================================

      - name: Install Clang compatibility libraries
        run: |
          set -e

          echo "=============================================="
          echo " Installing legacy ncurses compatibility libs"
          echo "=============================================="

          sudo apt-get update

          WORKDIR="${RUNNER_TEMP}/ncurses5"

          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          cd "$WORKDIR"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -o libtinfo5.deb \
            "https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.3_amd64.deb"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -o libncurses5.deb \
            "https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.3_amd64.deb"

          ls -lh *.deb

          file libtinfo5.deb
          file libncurses5.deb

          sudo dpkg -i ./libtinfo5.deb ./libncurses5.deb

          sudo ldconfig

          ldconfig -p | grep -E \
            'libncurses\.so\.5|libtinfo\.so\.5'

      # ============================================================
      # VERIFY HOST TOOLS
      # ============================================================

      - name: Verify host tools
        run: |
          set -e

          make --version | head -n1
          python3 --version
          git --version
          bc --version | head -n1
          dtc --version

          which aarch64-linux-gnu-ld
          which aarch64-linux-gnu-as
          which aarch64-linux-gnu-objcopy
          which aarch64-linux-gnu-strip

          aarch64-linux-gnu-ld --version | head -n1

      # ============================================================
      # CLONE ASSEMBLED TREE
      # ============================================================

      - name: Clone assembled tree
        run: |
          set -e

          git clone \
            --depth=1 \
            -b "${{ inputs.source_branch }}" \
            "https://github.com/${{ github.repository }}.git" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/VENOMCORE_ASSEMBLY.md"
          test -d "$KERNEL_DIR/kernel-5.10"
          test -f "$KERNEL_DIR/kernel-5.10/Makefile"
          test -d "$KERNEL_DIR/kernel-5.10/arch/arm64/configs"

          echo "--- checking sibling vendor/mediatek/kernel_modules/ ---"
          if [ -d "$KERNEL_DIR/vendor/mediatek/kernel_modules" ]; then
            ls "$KERNEL_DIR/vendor/mediatek/kernel_modules"
          else
            echo "::warning::vendor/mediatek/kernel_modules not found next to kernel-5.10 — modules will not be picked up"
          fi

          make -C "$KERNEL_DIR/kernel-5.10" kernelversion

      # ============================================================
      # INSPECT TREE
      # ============================================================

      - name: Inspect assembled tree
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          git log -1 --oneline
          make kernelversion

          echo "Available defconfigs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          if [ -d drivers/misc/mediatek ]; then
            echo "drivers/misc/mediatek: FOUND"
          else
            echo "drivers/misc/mediatek: NOT FOUND"
          fi

          if [ -d vendor/mtk_modules_raw ]; then
            echo "vendor/mtk_modules_raw: FOUND"
          else
            echo "vendor/mtk_modules_raw: NOT FOUND"
          fi

      # ============================================================
      # LOCATE DEFCONFIG
      # ============================================================

      - name: Locate defconfig
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          CONFIG_DIR="arch/${ARCH}/configs"

          ls -lah "$CONFIG_DIR"

          FOUND=$(find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            -iname "*spinel*defconfig*" \
            -print \
            | head -n1)

          if [ -n "$FOUND" ]; then
            DEFCONFIG_NAME=$(basename "$FOUND")
            echo "Using Spinel-specific defconfig: $DEFCONFIG_NAME"
            echo "DEFCONFIG=$DEFCONFIG_NAME" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -f "$CONFIG_DIR/defconfig" ]; then
            echo "Using generic defconfig"
            echo "DEFCONFIG=defconfig" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -f "$CONFIG_DIR/gki_defconfig" ]; then
            echo "Using GKI defconfig"
            echo "DEFCONFIG=gki_defconfig" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::No usable defconfig found."
          exit 1

      # ============================================================
      # ANDROID CLANG
      # ============================================================

      - name: Set up Android Clang
        run: |
          set -e

          rm -rf clang

          git clone \
            --depth=1 \
            -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang

          CLANG_BIN_DIR=$(find clang \
            -type f \
            -name clang.real \
            -printf '%h\n' \
            | head -n1)

          test -n "$CLANG_BIN_DIR"

          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"

          ls -lah "$CLANG_BIN_DIR"

      # ============================================================
      # VERIFY CLANG
      # ============================================================

      - name: Verify Clang
        run: |
          set -e

          which clang
          clang --version

          which clang++

          which ld.lld || true
          which llvm-ar || true
          which llvm-nm || true
          which llvm-objcopy || true

          ldconfig -p | grep -E \
            'libncurses\.so\.5|libtinfo\.so\.5'

          clang.real --version

      # ============================================================
      # KERNELSU-NEXT
      # ============================================================

      - name: Set up KernelSU-Next
        if: ${{ inputs.ksu_variant == 'KernelSU-Next' }}
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          echo "=============================================="
          echo " Setting up KernelSU-Next (${{ inputs.kernelsu_ref }})"
          echo "=============================================="

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${{ inputs.kernelsu_ref }}"

          test -d KernelSU-Next

          git -C KernelSU-Next log -1 --oneline

          KSU_GIT_VERSION=$(git -C KernelSU-Next rev-list --count HEAD)
          echo "KSU_GIT_VERSION=$KSU_GIT_VERSION" >> "$GITHUB_ENV"

      # ============================================================
      # SUKISU-ULTRA
      # ============================================================

      - name: Set up SukiSU-Ultra
        if: ${{ inputs.ksu_variant == 'SukiSU-Ultra' }}
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          echo "=============================================="
          echo " Setting up SukiSU-Ultra"
          echo "=============================================="

          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s main

          if [ ! -d KernelSU-Next ] && [ ! -d KernelSU ]; then
            echo "::error::SukiSU-Ultra setup did not create a KernelSU source directory."
            exit 1
          fi

          git -C KernelSU-Next log -1 --oneline || true

          echo "KSU_GIT_VERSION=$(git -C KernelSU-Next rev-list --count HEAD)" >> "$GITHUB_ENV"

      # ============================================================
      # SUSFS
      # ============================================================

      - name: Apply SUSFS
        if: ${{ inputs.susfs_enabled }}
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          echo "=============================================="
          echo " Applying SUSFS"
          echo "=============================================="

          rm -rf susfs4ksu

          # Fetch exact ref (branch, tag, or commit SHA)
          git init susfs4ksu
          git -C susfs4ksu remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          git -C susfs4ksu fetch --depth=1 origin "${{ inputs.susfs_ref }}"
          git -C susfs4ksu checkout FETCH_HEAD

          echo
          echo "SUSFS commit:"
          git -C susfs4ksu log -1 --oneline

          echo
          echo "Copying SUSFS filesystem hooks..."
          test -d susfs4ksu/kernel_patches/fs
          test -d susfs4ksu/kernel_patches/include/linux

          cp -a susfs4ksu/kernel_patches/fs/. fs/
          cp -a susfs4ksu/kernel_patches/include/linux/. include/linux/

          # ---- helper: apply patch, tolerate offsets, HARD-FAIL with full rejects ----
          apply_patch_or_fail() {
            local patch_file="$1"
            local target_dir="$2"
            local patch_abs="$PWD/$patch_file"

            echo
            echo "Applying: $patch_file  ->  $target_dir"

            if [ -d "$target_dir/.git" ]; then
              if ( cd "$target_dir" && git apply --3way "$patch_abs" 2>/dev/null ); then
                echo "Applied cleanly (git apply --3way)"
                return 0
              fi
              # reset any partial 3-way attempt before falling back
              git -C "$target_dir" reset --hard HEAD >/dev/null 2>&1 || true
              git -C "$target_dir" clean -fd >/dev/null 2>&1 || true
            fi

            if ( cd "$target_dir" && patch -p1 --forward --no-backup-if-mismatch -f < "$patch_abs" ); then
              echo "Applied with patch(1)"
            else
              echo "::error::Failed to apply $patch_file"
              find "$target_dir" -name '*.rej' -print -exec cat {} \;
              exit 1
            fi

            if find "$target_dir" -name '*.rej' | grep -q .; then
              echo "::error::$patch_file left reject files behind:"
              find "$target_dir" -name '*.rej' -print -exec cat {} \;
              exit 1
            fi
          }

          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
          test -f "$SUSFS_KERNEL_PATCH"
          apply_patch_or_fail "$SUSFS_KERNEL_PATCH" "."

          SUSFS_KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          test -f "$SUSFS_KSU_PATCH"

          KSU_TARGET_DIR=""
          if [ -d KernelSU-Next ]; then
            KSU_TARGET_DIR="KernelSU-Next"
          elif [ -d KernelSU ]; then
            KSU_TARGET_DIR="KernelSU"
          fi

          if [ "${{ inputs.ksu_variant }}" = "SukiSU-Ultra" ]; then

            echo
            echo "SukiSU-Ultra already ships integrated SUSFS support."
            echo "Skipping the KernelSU-side SUSFS patch on purpose."

          elif [ -z "$KSU_TARGET_DIR" ]; then

            echo "::error::KernelSU source directory not found."
            exit 1

          elif grep -rq "KSU_SUSFS" "$KSU_TARGET_DIR/kernel/Kconfig" 2>/dev/null \
            || grep -rq "KSU_SUSFS" "$KSU_TARGET_DIR/Kconfig" 2>/dev/null; then

            echo
            echo "$KSU_TARGET_DIR already has SUSFS Kconfig options built in"
            echo "(this KernelSU-Next ref ships its own susfs integration)."
            echo "Skipping the susfs4ksu patch here to avoid a duplicate-hunk conflict."

          else

            apply_patch_or_fail "$SUSFS_KSU_PATCH" "$KSU_TARGET_DIR"

          fi

          echo
          echo "SUSFS applied successfully."

      # ============================================================
      # VENOMCORE CONFIGURATION
      # ============================================================

      - name: Apply VenomCore configuration
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          echo "=============================================="
          echo " Applying VenomCore configuration"
          echo "=============================================="

          CFG="arch/${ARCH}/configs/${DEFCONFIG}"

          test -f "$CFG"

          echo "Config: $CFG"

          sed -i \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KSU_SUSFS=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_PATH=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_MOUNT=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_KSTAT=/d' \
            -e '/^CONFIG_KSU_SUSFS_SUS_SU=/d' \
            -e '/^CONFIG_KSU_SUSFS_TRY_UMOUNT=/d' \
            -e '/^CONFIG_KSU_SUSFS_SPOOF_UNAME=/d' \
            -e '/^CONFIG_KSU_SUSFS_OPEN_REDIRECT=/d' \
            -e '/^CONFIG_LOCALVERSION=/d' \
            "$CFG"

          echo "CONFIG_KSU=y" >> "$CFG"

          if [ "${{ inputs.susfs_enabled }}" = "true" ]; then

            echo "CONFIG_KSU_SUSFS=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CFG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CFG"

          else

            echo "CONFIG_KSU_SUSFS=n" >> "$CFG"

          fi

          echo 'CONFIG_LOCALVERSION="-${{ inputs.kernel_name }}"' >> "$CFG"

          echo
          tail -n30 "$CFG"

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      # NOTE: LLVM=1 / LLVM_IAS=1 were REMOVED here. The AOSP clang prebuilt
      # branch used above does not ship a working ld.lld on PATH, which made
      # kbuild fail with "linker 'ld.lld' not found". Since binutils-aarch64-
      # linux-gnu is already installed, we build with clang as the compiler
      # but GNU aarch64-linux-gnu-ld as the linker instead — a standard,
      # working combo for older (5.10-era) Android kernels.

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -o pipefail

          echo "=============================================="
          echo " Building VenomCore"
          echo "=============================================="

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          rm -rf out
          mkdir -p out

          make \
            ARCH="${ARCH}" \
            O=out \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            HOSTCXX="${HOSTCXX}" \
            "${DEFCONFIG}"

          test -f out/.config

          echo
          grep -E '^CONFIG_KSU=' out/.config || true
          grep -E '^CONFIG_KSU_SUSFS' out/.config || true
          grep -E '^CONFIG_LOCALVERSION=' out/.config || true

          make \
            ARCH="${ARCH}" \
            O=out \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            HOSTCXX="${HOSTCXX}" \
            -j"$(nproc --all)" \
            2>&1 \
            | tee build.log

          echo
          echo "Verifying SUSFS is actually built-in..."
          if [ "${{ inputs.susfs_enabled }}" = "true" ]; then
            grep -E '^CONFIG_KSU_SUSFS=y' out/.config
            nm out/vmlinux 2>/dev/null | grep -i susfs | head -n 10 \
              || echo "::warning::No susfs symbols found in vmlinux"
          fi

          BOOT_DIR="out/arch/arm64/boot"
          ls -lah "$BOOT_DIR"

          IMAGE=""
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT_DIR/$f" ]; then
              IMAGE="$f"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "::error::No kernel image found in $BOOT_DIR"
            exit 1
          fi

          echo "KERNEL_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Kernel image: $IMAGE"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package artifacts
        if: success()
        working-directory: ${{ env.KERNEL_DIR }}/kernel-5.10
        run: |
          set -e

          RELEASE="$GITHUB_WORKSPACE/release"
          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          BOOT_DIR="out/arch/arm64/boot"

          cp "$BOOT_DIR/${{ env.KERNEL_IMAGE }}" \
            "$RELEASE/${{ inputs.kernel_name }}-${{ env.KERNEL_IMAGE }}"

          find "$BOOT_DIR" -maxdepth 1 \
            \( -name '*.dtb' -o -name 'dtbo.img' \) \
            -exec cp {} "$RELEASE/" \;

          cp out/.config "$RELEASE/config.txt"
          cp build.log "$RELEASE/build.log"

          cd "$RELEASE"
          sha256sum * > sha256.txt
          ls -lah

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.kernel_name }}-spinel-run${{ github.run_number }}"
          path: |
            release/
            kernel_workspace/kernel-5.10/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          {
            echo "### 🐍 ${{ inputs.kernel_name }} — spinel build"
            echo "- Source branch: \`${{ inputs.source_branch }}\`"
            echo "- Root: ${{ inputs.ksu_variant }}"
            echo "- SUSFS: ${{ inputs.susfs_enabled }} (ref: ${{ inputs.susfs_ref }})"
            echo "- Defconfig: ${DEFCONFIG:-not resolved}"
            echo "- Kernel image: ${KERNEL_IMAGE:-not produced}"
          } >> "$GITHUB_STEP_SUMMARY"
