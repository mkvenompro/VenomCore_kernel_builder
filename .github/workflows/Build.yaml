      # ============================================================
      # PACKAGE ANYKERNEL ZIP
      # ============================================================

      - name: Package VenomCore AnyKernel3 ZIP

        run: |

          set -e

          ZIP_NAME="VenomCore-spinel-${{ inputs.ksu_variant }}-build${{ github.run_number }}.zip"

          echo "=========================================="
          echo " Creating flashable ZIP"
          echo "=========================================="

          cd AnyKernel3

          zip \
            -r9 \
            "../${ZIP_NAME}" \
            . \
            -x ".git*" \
            -x "README.md"


          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          echo
          echo "Created:"
          ls -lh "${ZIP_NAME}"


      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: VenomCore-build-log-${{ github.run_number }}

          path: |
            ${{ env.KERNEL_DIR }}/build.log

          if-no-files-found: ignore

          retention-days: 14


      # ============================================================
      # UPLOAD RAW IMAGE
      # ============================================================

      - name: Upload raw kernel image

        if: success()

        uses: actions/upload-artifact@v4

        with:
          name: VenomCore-spinel-raw-${{ github.run_number }}

          path: VenomCore-out/Image

          if-no-files-found: error

          retention-days: 14


      # ============================================================
      # UPLOAD FLASHABLE ZIP
      # ============================================================

      - name: Upload flashable AnyKernel3 ZIP

        if: success()

        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.ZIP_NAME }}

          path: ${{ env.ZIP_NAME }}

          if-no-files-found: error

          retention-days: 14


      # ============================================================
      # BUILD SUMMARY
      # ============================================================

      - name: Build summary

        if: always()

        run: |

          echo "## 🐍 VenomCore Kernel Build" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Device" >> "$GITHUB_STEP_SUMMARY"

          echo "- Redmi Note 15 4G" >> "$GITHUB_STEP_SUMMARY"
          echo "- Codename: spinel" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android: 15" >> "$GITHUB_STEP_SUMMARY"
          echo "- HyperOS: 2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: 5.10" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build" >> "$GITHUB_STEP_SUMMARY"

          echo "- Source branch: \`${{ inputs.source_branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root: \`${{ inputs.ksu_variant }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SUSFS: \`${{ inputs.susfs_enabled }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Defconfig: \`${DEFCONFIG:-not resolved}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build number: \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"

          echo "- Android Clang: master-kernel-build-2021" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLVM: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLVM IAS: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- AArch64 GNU binutils: enabled" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Output" >> "$GITHUB_STEP_SUMMARY"

          if [ -f VenomCore-out/Image ]; then
            echo "- Raw Image: generated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Raw Image: not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${ZIP_NAME:-}" ] && [ -f "${ZIP_NAME}" ]; then
            echo "- AnyKernel3 ZIP: generated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- AnyKernel3 ZIP: not generated" >> "$GITHUB_STEP_SUMMARY"
          fi
