name: 🧩 VenomCore Tree Assembler v2 (spinel)

# Correct layout, based on the actual MTK Makefile wiring:
#   drivers/misc/mediatek/connectivity/Makefile (already inside Xiaomi_Kernel_OpenSource)
#   expects a SIBLING directory one level above the kernel source root:
#     $(srctree)/../vendor/mediatek/kernel_modules/connectivity/...
#
# So the pushed tree layout is:
#   kernel-5.10/                              <- Xiaomi_Kernel_OpenSource (matches KERNEL_DIR in build.config)
#   vendor/mediatek/kernel_modules/<name>/     <- each top-level folder from MTK_kernel_modules
#   kernel_build/                              <- kept for reference
#
# Maintainer: MkVenomPro

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch in THIS repo to push the assembled tree to"
        required: true
        default: "spinel-assembled-v2"

permissions:
  contents: write

env:
  KERNEL_BRANCH: spinel-v-oss
  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
  MTK_MODULES_REPO: https://github.com/MiCode/MTK_kernel_modules
  KERNEL_BUILD_REPO: https://github.com/MiCode/kernel_build
  WORKDIR: assembled_tree

jobs:
  assemble:
    name: Assemble spinel tree (v2 layout)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true

      - name: Create workspace layout
        run: |
          set -e
          mkdir -p "$WORKDIR"

      - name: Clone kernel source into kernel-5.10/
        run: |
          set -e
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$WORKDIR/kernel-5.10"
          rm -rf "$WORKDIR/kernel-5.10/.git"
          echo "--- kernel-5.10/ top-level ---"
          ls "$WORKDIR/kernel-5.10"

      - name: Confirm the connectivity glue Makefile exists in-tree
        run: |
          set -e
          GLUE="$WORKDIR/kernel-5.10/drivers/misc/mediatek/connectivity/Makefile"
          if [ -f "$GLUE" ]; then
            echo "Found glue Makefile: $GLUE"
            echo "--- relevant PATH_TO_* lines ---"
            grep -n "PATH_TO_" "$GLUE" || true
          else
            echo "::warning::no drivers/misc/mediatek/connectivity/Makefile found — the sibling-symlink trick below may not trigger. Inspect drivers/misc/mediatek/ manually."
            find "$WORKDIR/kernel-5.10/drivers/misc/mediatek" -maxdepth 2 2>/dev/null || echo "drivers/misc/mediatek not found either"
          fi

      - name: Clone MTK kernel modules
        run: |
          set -e
          git clone --depth=1 -b "$KERNEL_BRANCH" "$MTK_MODULES_REPO" mtk_modules_src
          echo "--- top-level of MTK modules ---"
          ls mtk_modules_src

      - name: Place modules as sibling: vendor/mediatek/kernel_modules/
        run: |
          set -e
          DEST="$WORKDIR/vendor/mediatek/kernel_modules"
          mkdir -p "$DEST"
          for d in mtk_modules_src/*/; do
            name=$(basename "$d")
            echo "Placing $name -> $DEST/$name"
            rsync -a "$d" "$DEST/$name/" --exclude=".git"
          done
          echo "--- resulting vendor/mediatek/kernel_modules/ ---"
          ls "$DEST"

      - name: Clone kernel_build (kept for reference, not merged into source)
        run: |
          set -e
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_BUILD_REPO" "$WORKDIR/kernel_build"
          rm -rf "$WORKDIR/kernel_build/.git"

      - name: Write assembly notes into the tree
        run: |
          cat > "$WORKDIR/VENOMCORE_ASSEMBLY.md" << 'EOF'
          # VenomCore assembled tree v2 — spinel

          Layout (matches the real MTK build wiring, not a guess this time):

          ```
          kernel-5.10/                              <- Xiaomi_Kernel_OpenSource @ spinel-v-oss
          vendor/mediatek/kernel_modules/<name>/     <- each top-level dir from MTK_kernel_modules
          kernel_build/                              <- AOSP kernel/build scripts, reference only
          ```

          This mirrors: drivers/misc/mediatek/connectivity/Makefile inside kernel-5.10
          expects `$(srctree)/../vendor/mediatek/kernel_modules/connectivity/...` to exist
          as a SIBLING directory, and symlinks it in automatically when found — building
          WLAN/BT/connfem/etc IN-TREE as part of the normal kernel build, no separate
          out-of-tree module build step needed.

          Base tag: alps-mp-s0.mp1.tc8sp2-cs1-xm.V1.143.1

          Still to verify once you build: whether a defconfig flag like
          CONFIG_WLAN_DRV_BUILD_IN=y (or similar) needs to be turned on for the
          glue Makefile to actually pick the modules up — check the glue Makefile's
          PATH_TO_* / CONFIG_* guards printed by the assembler workflow's log.
          EOF

      - name: Check for files over GitHub's 100MB push limit
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          BIG=$(find . -type f -size +95M -not -path "./.git/*" || true)
          if [ -n "$BIG" ]; then
            echo "::warning::files over ~95MB found — excluding them so the push doesn't fail:"
            echo "$BIG"
            echo "$BIG" | sed 's|^\./||' > /tmp/big_files.txt
            while IFS= read -r f; do
              [ -n "$f" ] && rm -f "$f" && echo "removed: $f"
            done < /tmp/big_files.txt
            {
              echo ""
              echo "## Files excluded (over 100MB, need Git LFS if you want them)"
              cat /tmp/big_files.txt
            } >> VENOMCORE_ASSEMBLY.md
          else
            echo "No files over 95MB — good."
          fi

      - name: Commit assembled tree
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          rm -rf .git
          git init -q
          git config user.name "VenomCore Assembler Bot"
          git config user.email "actions@github.com"
          git checkout -q -b "${{ inputs.target_branch }}"
          git add -A
          git commit -q -m "VenomCore: assemble spinel tree v2 ($(date -u +%Y-%m-%d))"
          echo "Commit created. Object count:"
          git count-objects -v

      - name: Push assembled tree to this repo
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          echo "Pushing to branch ${{ inputs.target_branch }} ..."
          if ! git push --force origin "${{ inputs.target_branch }}" 2>push_error.log; then
            echo "::error::push failed — printing the raw git error below"
            cat push_error.log
            echo ""
            echo "::error::most likely cause: repo Settings → Actions → General → Workflow permissions is set to 'Read repository contents permission (read only)'. Switch it to 'Read and write permissions' and re-run this workflow."
            exit 1
          fi
          echo "Push succeeded."

      - name: Summary
        run: |
          echo "### 🧩 spinel tree v2 assembled" >> $GITHUB_STEP_SUMMARY
          echo "- Pushed to branch: \`${{ inputs.target_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- kernel-5.10/ = Xiaomi_Kernel_OpenSource @ $KERNEL_BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- vendor/mediatek/kernel_modules/ = MTK_kernel_modules, placed as sibling (real layout)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Review VENOMCORE_ASSEMBLY.md — check the glue Makefile log in the 'Confirm the connectivity glue Makefile' step" >> $GITHUB_STEP_SUMMARY
